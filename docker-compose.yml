version: "3.9"

services:
  research-assistant:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: research-assistant
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      # Persist research outputs
      - ./research_outputs:/app/research_outputs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
