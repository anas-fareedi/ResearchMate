version: 1.0
runtime: python310
build:
  commands:
    pre-build:
      - python -m pip install --upgrade pip setuptools wheel
    build:
      - pip install --no-cache-dir -r requirements.txt
run:
  command: gunicorn -c APP/gunicorn_conf.py APP.app:app
  network:
    port: 8080
  env:
    - name: ENVIRONMENT
      value: production
